<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · Common Ground</title>
    <link rel="stylesheet" href="../home.css">
    {{ head }}
  </head>
  <body class="map-page">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="site-brand" href="../index.html">Common Ground</a>
      <div class="nav-links">
        <a class="nav-link" href="../index.html">Home</a>
        <a class="nav-link" href="../empty-buildings/index.html">Empty buildings</a>
        <a class="nav-link active" href="../recent-expulsions/index.html" aria-current="page">Recent expulsions</a>
      </div>
    </nav>
    <main class="map-shell">
      <header class="map-header">
        <a class="wordmark" href="./">{{ title }}</a>
        <span class="feature-count">{{ count }} places</span>
      </header>
      {{ map }}
      {{ panel }}
      <footer class="map-footer">Select a feature to explore</footer>
    </main>
    {{ scripts }}
  </body>
</html>

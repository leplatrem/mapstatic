[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapstatic"
version = "0.1.0"
description = "Build static, Git-friendly interactive maps from GeoJSON and Markdown."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "markdown-it-py>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mapstatic = "mapstatic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mapstatic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
